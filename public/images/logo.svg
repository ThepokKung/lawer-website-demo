<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8EC"/>
      <stop offset="45%" stop-color="#D5B76C"/>
      <stop offset="100%" stop-color="#9A7736"/>
    </linearGradient>
    <linearGradient id="crestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E224D"/>
      <stop offset="100%" stop-color="#060E21"/>
    </linearGradient>
  </defs>

  <!-- Sharp 2px Rounded Background -->
  <rect width="100" height="100" rx="2" fill="url(#crestBg)"/>
  <rect x="2.5" y="2.5" width="95" height="95" rx="2" stroke="url(#goldGrad)" stroke-width="1.25" stroke-opacity="0.7"/>
  <rect x="5" y="5" width="90" height="90" rx="2" stroke="url(#goldGrad)" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Architectural Sharp Hexagonal Crest -->
  <path d="M50 13 L82 29 V65 L50 85 L18 65 V29 Z" stroke="url(#goldGrad)" stroke-width="1.75" stroke-linejoin="miter"/>
  
  <!-- Central Pillar & Scales of Justice -->
  <path d="M50 20 V72" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M42 72 H58" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="square"/>
  
  <!-- Scales Balance Bar -->
  <path d="M28 32 H72" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="square"/>
  
  <!-- Left Scale Pan -->
  <path d="M28 32 L22 45 H34 Z" stroke="url(#goldGrad)" stroke-width="1.5" fill="#B38E46" fill-opacity="0.25" stroke-linejoin="miter"/>
  <!-- Right Scale Pan -->
  <path d="M72 32 L66 45 H78 Z" stroke="url(#goldGrad)" stroke-width="1.5" fill="#B38E46" fill-opacity="0.25" stroke-linejoin="miter"/>

  <!-- Architectural 'S' and 'M' Overlay -->
  <!-- 'S' Curve centered -->
  <path d="M57 24 C44 24 43 33 50 37 C57 41 57 51 43 51" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- 'M' at base -->
  <path d="M30 68 V46 L50 60 L70 46 V68" stroke="url(#goldGrad)" stroke-width="2.25" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
