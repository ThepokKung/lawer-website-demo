<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Navy Background with Sharp 2px Corners -->
  <rect width="100" height="100" rx="2" fill="#0B1B3D"/>
  <rect x="2" y="2" width="96" height="96" rx="2" stroke="#B38E46" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Architectural Sharp Hexagonal Crest -->
  <path d="M50 12 L82 28 V66 L50 86 L18 66 V28 Z" stroke="#B38E46" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M50 17 L78 31 V63 L50 81 L22 31 Z" stroke="#B38E46" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Scales of Justice & Central Pillar -->
  <path d="M50 20 V74" stroke="#D5B76C" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M42 74 H58" stroke="#D5B76C" stroke-width="2.5" stroke-linecap="square"/>
  
  <!-- Balance Beam -->
  <path d="M30 32 H70" stroke="#D5B76C" stroke-width="2" stroke-linecap="square"/>
  
  <!-- Left Scale Pan -->
  <path d="M30 32 L24 45 H36 Z" stroke="#D5B76C" stroke-width="1.5" fill="#B38E46" fill-opacity="0.15" stroke-linejoin="miter"/>
  <!-- Right Scale Pan -->
  <path d="M70 32 L64 45 H76 Z" stroke="#D5B76C" stroke-width="1.5" fill="#B38E46" fill-opacity="0.15" stroke-linejoin="miter"/>

  <!-- Monogram M & S Sharp Architectural Overlay -->
  <!-- Letter M -->
  <path d="M32 68 V48 L50 62 L68 48 V68" stroke="#F3E8CE" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
