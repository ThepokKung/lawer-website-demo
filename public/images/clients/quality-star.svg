<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <!-- Precision Star Emblem -->
  <g transform="translate(10, 8)">
    <circle cx="21" cy="21" r="20" fill="#EFF6FF" stroke="#1E40AF" stroke-width="2" />
    <!-- 8-point faceted star -->
    <polygon points="21,5 25,16 36,21 25,26 21,37 17,26 6,21 17,16" fill="#1E40AF" />
    <polygon points="21,11 23,18 30,21 23,24 21,31 19,24 12,21 19,18" fill="#F59E0B" />
  </g>
  <!-- Brand Name -->
  <text x="60" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#1E40AF" letter-spacing="1">QUALITY STAR</text>
  <!-- Subtitle -->
  <text x="60" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="2">ENGINEERING CO., LTD.</text>
</svg>
